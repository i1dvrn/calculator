<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class ="calc">
        <div class="calc__display">
            <div class="calc__display--history">
                <p>calculator that do math</p>
            </div>
            <div class="calc__display--now">
                <p>0</p>
            </div>
        </div>
        <div class="calc__buttons">
            <button class="calc__button" id = "ac">AC</button>
            <button class="calc__button" id = "del">DEL</button>
            <button class="calc__button" id="7">7</button>
            <button class="calc__button" id="8">8</button>
            <button class="calc__button" id="9">9</button>
            <button class="calc__button" id="divide">/</button>
            <button class="calc__button" id="4">4</button>
            <button class="calc__button" id="5">5</button>
            <button class="calc__button" id="6">6</button>
            <button class="calc__button" id="multiply">x</button>
            <button class="calc__button" id="1">1</button>
            <button class="calc__button" id="2">2</button>
            <button class="calc__button" id="3">3</button>
            <button class="calc__button" id="subtract">-</button>
            <button class="calc__button" id="decimal">.</button>
            <button class="calc__button" id="0">0</button>
            <button class="calc__button" id="equals">=</button>
            <button class="calc__button" id="add">+</button>

        </div>
    </div>
</body>
</html>
